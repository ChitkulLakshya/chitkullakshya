name: Update Language Treemap

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-treemap.yml'
      - 'scripts/gen_language_treemap.py'

permissions:
  contents: write # Needed to commit the updated treemap back to the repo

jobs:
  update-treemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir matplotlib squarify

      - name: Generate language treemap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gen_language_treemap.py --user ChitkulLakshya --output assets/language-treemap.png

      - name: Commit updated treemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-treemap.png
          if git diff --cached --quiet; then
            echo "No changes to treemap, skipping commit."
          else
            git commit -m "chore: auto-update language treemap [skip ci]"
            git push
          fi
