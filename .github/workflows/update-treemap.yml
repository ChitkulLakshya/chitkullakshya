name: Update Profile Stats

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-treemap.yml'
      - 'scripts/gen_language_treemap.py'
      - 'scripts/gen_contribution_heatmap.py'
      - 'scripts/gen_repo_ranking.py'
      - 'scripts/gen_activity_heatmap.py'

permissions:
  contents: write # Needed to commit updated PNGs back to the repo

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir matplotlib squarify

      - name: Generate language donut chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gen_language_treemap.py --user ChitkulLakshya --output assets/language-treemap.png

      - name: Generate repo ranking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gen_repo_ranking.py --user ChitkulLakshya --output assets/repo-ranking.png

      - name: Generate activity heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gen_activity_heatmap.py --user ChitkulLakshya --output assets/activity-heatmap.png

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-treemap.png assets/repo-ranking.png assets/activity-heatmap.png
          if git diff --cached --quiet; then
            echo "No changes to stats, skipping commit."
          else
            git commit -m "chore: auto-update profile stats [skip ci]"
            git push
          fi
